{% extends "base.html" %}
{% block title %}Ro'yxatdan o'tish — E-Bloknot{% endblock %}

{% block content %}
<div class="card">
    <h1>Ro'yxatdan o'tish</h1>
    <p class="subtitle">E-Bloknotdan foydalanish uchun hisob yarating.</p>

    <!-- Forma /register ga POST usulida yuboriladi -->
    <form method="POST" action="{{ url_for('register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="full_name">Ism familiya</label>
        <input type="text" id="full_name" name="full_name" placeholder="Ali Valiyev">

        <label for="group_name">Guruh</label>
        <input type="text" id="group_name" name="group_name" placeholder="BI-525">

        <label for="username">Login</label>
        <input type="text" id="username" name="username" placeholder="alivaliyev">

        <label for="password">Parol</label>
        <input type="password" id="password" name="password" placeholder="Kamida 6 ta belgi">

        <label for="password2">Parolni takrorlang</label>
        <input type="password" id="password2" name="password2" placeholder="Parolni yana kiriting">

        <button type="submit" class="btn">Ro'yxatdan o'tish</button>
    </form>

    <p class="form-footer">
        Hisobingiz bormi? <a href="{{ url_for('login') }}">Kirish</a>
    </p>
</div>
{% endblock %}
